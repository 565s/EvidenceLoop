name: offline-checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: ''
      SIFLOW_API_KEY: ''
      SIFLOW_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts
      - run: python -m ruff format --check src scripts
      - run: python -m pytest -q --basetemp .test_runtime_tmp/ci
      - run: python -m build
      - run: python scripts/audit_release.py --artifact dist/evidenceloop-0.1.0-py3-none-any.whl dist/evidenceloop-0.1.0.tar.gz
      - name: Install wheel and invoke outside the checkout
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile, venv
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as work:
              root = pathlib.Path(work)
              venv.create(root / 'env', with_pip=True)
              executable = root / 'env' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(executable), '-m', 'pip', 'install', str(wheel)], check=True)
              subprocess.run([str(executable), '-m', 'evidenceloop', '--help'], cwd=root, check=True)
              subprocess.run([str(executable), '-c', 'from evidenceloop import Pipeline, PipelineConfig, Document; Pipeline(config=PipelineConfig()); from importlib.resources import files; assert files("evidenceloop.resources.prompts").joinpath("critic_system_prompt.txt").read_text(encoding="utf-8")'], cwd=root, check=True)
